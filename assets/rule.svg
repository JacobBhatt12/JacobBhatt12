<svg xmlns="http://www.w3.org/2000/svg" width="220" height="14" viewBox="0 0 220 14" fill="none" role="img">
<style>
:root{--ink:#8B949E;--muted:#8B949E;--line:#8B949E;--accent:#86C232;--sheen:#8B949E}
@media (prefers-color-scheme:dark){:root{--accent:#BBF047;--sheen:#fff}}
@media (prefers-color-scheme:light){:root{--sheen:#000}}

.track{opacity:0;animation:fade .8s cubic-bezier(.215,.61,.355,1) .15s forwards}
.draw{stroke-dasharray:220;stroke-dashoffset:220;transform-origin:center;
  animation:draw 1.15s cubic-bezier(.19,1,.22,1) .2s forwards}
.bead{opacity:0;animation:bead .7s cubic-bezier(.34,1.56,.64,1) 1.1s forwards}
@keyframes fade{to{opacity:.5}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes bead{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
</style>

<line x1="2" y1="7" x2="218" y2="7" stroke="var(--line)" stroke-width="1.5" stroke-linecap="round" class="track"/><line x1="2" y1="7" x2="218" y2="7" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" class="draw"/><circle cx="110.0" cy="7" r="3" fill="var(--accent)" class="bead"/>
</svg>
