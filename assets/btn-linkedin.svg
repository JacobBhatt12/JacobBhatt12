<svg xmlns="http://www.w3.org/2000/svg" width="86" height="86" viewBox="0 0 86 86" fill="none" role="img">
<style>
:root{--ink:#8B949E;--muted:#8B949E;--line:#8B949E;--accent:#86C232;--sheen:#8B949E}
@media (prefers-color-scheme:dark){:root{--accent:#BBF047;--sheen:#fff}}
@media (prefers-color-scheme:light){:root{--sheen:#000}}

.base{opacity:0;animation:fd .7s cubic-bezier(.215,.61,.355,1) 0.30s forwards}
.ring{stroke-dasharray:245.0;stroke-dashoffset:245.0;opacity:.55;
  animation:rd 1.25s cubic-bezier(.19,1,.22,1) 0.40s forwards}
.ic{opacity:0;transform-box:fill-box;transform-origin:center;
  animation:ip .8s cubic-bezier(.34,1.56,.64,1) 0.65s forwards, bob 5s ease-in-out 1.90s infinite}
.sw{animation:sw 6s cubic-bezier(.165,.84,.44,1) 2.10s infinite}
@keyframes fd{to{opacity:1}}
@keyframes rd{to{stroke-dashoffset:0}}
@keyframes ip{from{opacity:0;transform:scale(.5) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes sw{0%{transform:translateX(0)}28%,100%{transform:translateX(172px)}}
</style>
<defs><linearGradient id="btn-linkedins" x1="0" x2="1"><stop offset="0" stop-color="var(--sheen)" stop-opacity="0"/><stop offset=".5" stop-color="var(--sheen)" stop-opacity=".16"/><stop offset="1" stop-color="var(--sheen)" stop-opacity="0"/></linearGradient></defs>
<clipPath id="btn-linkedin"><circle cx="43.0" cy="43.0" r="39.0"/></clipPath><circle cx="43.0" cy="43.0" r="39.0" stroke="var(--line)" stroke-opacity=".45" stroke-width="1.5" class="base"/><circle cx="43.0" cy="43.0" r="39.0" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" class="ring" transform="rotate(-90 43.0 43.0)"/><g clip-path="url(#btn-linkedin)"><rect x="-86" y="0" width="86" height="86" fill="url(#btn-linkedins)" class="sw"/></g><g class="ic" color="var(--accent)"><g transform="translate(29.50,29.50) scale(0.21094)" fill="var(--accent)"><path d="M21.06 48.73h18.11V107H21.06zm9.06-29a10.5 10.5 0 11-10.5 10.49 10.5 10.5 0 0110.5-10.49M50.53 48.73h17.36v8h.24c2.42-4.58 8.32-9.41 17.13-9.41C103.6 47.28 107 59.35 107 75v32H88.89V78.65c0-6.75-.12-15.44-9.41-15.44s-10.87 7.36-10.87 15V107H50.53z"/></g></g>
</svg>
