<svg xmlns="http://www.w3.org/2000/svg" width="86" height="86" viewBox="0 0 86 86" fill="none" role="img">
<style>
:root{--ink:#8B949E;--muted:#8B949E;--line:#8B949E;--accent:#86C232;--sheen:#8B949E}
@media (prefers-color-scheme:dark){:root{--accent:#BBF047;--sheen:#fff}}
@media (prefers-color-scheme:light){:root{--sheen:#000}}

.base{opacity:0;animation:fd .7s cubic-bezier(.215,.61,.355,1) 0.15s forwards}
.ring{stroke-dasharray:245.0;stroke-dashoffset:245.0;opacity:.55;
  animation:rd 1.25s cubic-bezier(.19,1,.22,1) 0.25s forwards}
.ic{opacity:0;transform-box:fill-box;transform-origin:center;
  animation:ip .8s cubic-bezier(.34,1.56,.64,1) 0.50s forwards, bob 5s ease-in-out 1.75s infinite}
.sw{animation:sw 6s cubic-bezier(.165,.84,.44,1) 1.95s infinite}
@keyframes fd{to{opacity:1}}
@keyframes rd{to{stroke-dashoffset:0}}
@keyframes ip{from{opacity:0;transform:scale(.5) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes sw{0%{transform:translateX(0)}28%,100%{transform:translateX(172px)}}
</style>
<defs><linearGradient id="btn-webs" x1="0" x2="1"><stop offset="0" stop-color="var(--sheen)" stop-opacity="0"/><stop offset=".5" stop-color="var(--sheen)" stop-opacity=".16"/><stop offset="1" stop-color="var(--sheen)" stop-opacity="0"/></linearGradient></defs>
<clipPath id="btn-web"><circle cx="43.0" cy="43.0" r="39.0"/></clipPath><circle cx="43.0" cy="43.0" r="39.0" stroke="var(--line)" stroke-opacity=".45" stroke-width="1.5" class="base"/><circle cx="43.0" cy="43.0" r="39.0" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" class="ring" transform="rotate(-90 43.0 43.0)"/><g clip-path="url(#btn-web)"><rect x="-86" y="0" width="86" height="86" fill="url(#btn-webs)" class="sw"/></g><g class="ic" color="var(--accent)"><g transform="translate(28.50,28.50) scale(1.20833)"><g fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9.2"/><path d="M2.8 12h18.4"/><path d="M12 2.8c2.4 2.6 3.6 5.8 3.6 9.2s-1.2 6.6-3.6 9.2c-2.4-2.6-3.6-5.8-3.6-9.2S9.6 5.4 12 2.8Z"/></g></g></g>
</svg>
